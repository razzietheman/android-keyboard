name: Build T9 debug APK

# Kör automatiskt vid push till main/master, och kan även triggas manuellt
# från GitHub:s "Actions"-flik ("Run workflow"-knappen).
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub:s ubuntu-runners har redan Android SDK (platform 35,
      # build-tools) förinstallerat via ANDROID_HOME. Det som saknas är
      # exakt den NDK-version FUTO:s build.gradle kräver (ndkVersion
      # '28.2.13676358'), så den installerar vi explicit.
      - name: Install required NDK version
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "ndk;28.2.13676358" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # unstable+debug är standardflavorn (getIsDefault().set(true) i
      # build.gradle) och kräver ingen release-signering — debug-builds
      # signeras automatiskt med en auto-genererad debug-nyckel, som
      # räcker för att installera och testa på egen telefon.
      - name: Build debug APK
        run: ./gradlew assembleUnstableDebug --stacktrace

      - name: Find and upload APK
        uses: actions/upload-artifact@v4
        with:
          name: futo-t9-debug-apk
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error

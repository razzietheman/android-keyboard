name: Build and Release APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # T9-i-FUTO-patch (byggfel-fix): build.gradle deklarerar
      # ndkVersion '28.2.13676358'. Tidigare installerades 25.2.9519653
      # här, vilket inte matchar — AGP kräver EXAKT den deklarerade
      # versionen, så en mismatch gör att den ändå försöker
      # auto-ladda-ner rätt version (eller failar, beroende på miljö).
      # Installera rätt version direkt istället.
      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # T9-i-FUTO-patch (byggfel-fix): FUTO har produkt-flavors
      # (unstable/stable/playstore). Bara "assembleRelease" är en tom
      # paraply-uppgift som inte bygger något av de faktiska
      # APK-producerande varianterna. "unstable" är FUTO:s egen
      # standardflavor (getIsDefault().set(true) i build.gradle).
      - name: Build Release APK
        env:
          VERSION_CODE: 1
          VERSION_NAME: "1.0.0"
        run: ./gradlew assembleUnstableRelease --stacktrace

      - name: Locate APK
        run: |
          mkdir -p /tmp/apk_out
          find . -type f -name "*.apk" -exec cp {} /tmp/apk_out/ \;

          if [ -z "$(ls -A /tmp/apk_out)" ]; then
            echo "ERROR: Ingen APK-fil hittades efter bygget!"
            exit 1
          fi

          echo "Hittade följande APK:"
          ls -la /tmp/apk_out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/apk_out/*.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.0-{0}', github.sha) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Release {0}', github.sha) }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

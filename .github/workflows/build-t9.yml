name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: DIAGNOSTIK — lista alla faktiska Gradle-uppgifter
        run: |
          ./gradlew tasks --all > all-tasks.txt 2>&1 || true
          echo "===== assemble/package-relaterade uppgifter ====="
          grep -i "assemble\|package" all-tasks.txt || echo "(inga träffar alls!)"
          echo "===== projektlista ====="
          ./gradlew projects || true

      - name: Ladda upp diagnostik-fil
        uses: actions/upload-artifact@v4
        with:
          name: gradle-task-diagnostics
          path: all-tasks.txt

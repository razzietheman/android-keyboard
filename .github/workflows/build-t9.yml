name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: DIAGNOSTIK — visa build.gradles faktiska plugin-block
        run: |
          echo "===== rot-build.gradle: plugins{}-block ====="
          sed -n '/^plugins {/,/^}/p' build.gradle
          echo "===== rot-build.gradle: android{}-blockets f\u00f6rsta 20 rader ====="
          sed -n '/^android {/,+20p' build.gradle
          echo "===== finns applicationId? ====="
          grep -n "applicationId" build.gradle || echo "INGEN TR\u00c4FF"
          echo "===== t9engine/build.gradle plugins{} ====="
          sed -n '/^plugins {/,/^}/p' t9engine/build.gradle

      - name: DIAGNOSTIK — lista alla faktiska Gradle-uppgifter
        run: |
          ./gradlew tasks --all > all-tasks.txt 2>&1 || true
          echo "===== assemble/package-relaterade uppgifter ====="
          grep -i "assemble\|package" all-tasks.txt || echo "(inga tr\u00e4ffar alls!)"
          echo "===== projektlista ====="
          ./gradlew projects > projects.txt 2>&1 || true
          cat projects.txt

      - name: Ladda upp diagnostik-fil
        uses: actions/upload-artifact@v4
        with:
          name: gradle-task-diagnostics
          path: |
            all-tasks.txt
            projects.txt

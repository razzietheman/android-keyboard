name: "T9Symbols"

overrideWidths:
  Regular: 0.1

attributes:
  shiftable: false
  width: Grow
  showPopup: false
  moreKeyMode: OnlyExplicit
  useKeySpecShortcut: false
  style: Normal
  labelFlags:
    alignLabelOffCenter: true
    hasHintLabel: true

rows:
  # Rad 1 — siffror (visas bara om number row är avstängd på huvudlayouten)
  - letters: "1 2 3 4 5 6 7 8 9 0"
    numRowMode: Hideable

  # Rad 2 — filler (visas när number row är aktiv)
  - letters: "% \\ | = [ ] < > { }"
    numRowMode: Filler

  # Rad 3 — symboler
  - letters:
      - "@"
      - ["#", "№"]
      - "$"
      - "_"
      - "%"
      - "&"
      - ["-", "_", "\u2013", "\u2014", "\u207B", "\u208B", "\u00B7"]
      - ["+", "\u207A", "\u208A"]
      - "("
      - ")"

  # Rad 4 — shift + delete
  - letters:
      - $shift
      - "*"
      - "\""
      - "'"
      - ":"
      - ";"
      - "!"
      - "?"
      - $delete

  # Nedersta raden — tillbaka till alfabet + space + enter
  - bottom: "$alphabet , $number $space / . $enter"

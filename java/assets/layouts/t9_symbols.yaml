name: "T9Symbols"

overrideWidths:
  Regular: 0.1
  FunctionalKey: 0.18

attributes: &globalAttrs
  width: Grow
  showPopup: false
  moreKeyMode: OnlyExplicit
  useKeySpecShortcut: false
  style: Normal
  shiftable: false
  labelFlags:
    alignLabelOffCenter: true
    hasHintLabel: false

rows:
  # Rad 1 – siffror
  - letters: "1 2 3 4 5 6 7 8 9 0"
    numRowMode: Hideable

  # Rad 2 – extra symboler (när number row är på)
  - letters: "% \\ | = [ ] < > { }"
    numRowMode: Filler

  # Rad 3 – huvudsymboler (10 nycklar)
  - letters:
      - "@"
      - "#"
      - "$"
      - "_"
      - "%"
      - "&"
      - "-"
      - "+"
      - "("
      - ")"
    attributes: *globalAttrs
    splittable: false

  # Rad 4 – shift + symboler + delete
  - letters:
      - type: shift
        attributes: { width: Grow, style: Functional }
      - "*"
      - "\""
      - "'"
      - ":"
      - ";"
      - "!"
      - "?"
      - type: delete
        attributes: { width: Grow, style: Functional, repeatableEnabled: true }
    attributes: *globalAttrs
    splittable: false

  # Nedersta raden – tät
  - bottom:
      - type: alphabet
        attributes: { width: Grow, style: Functional }
      - {type: base, spec: ",", attributes: { width: Grow }}
      - type: number
        attributes: { width: Grow, style: Functional }
      - type: space
        attributes: { width: Grow }
      - {type: base, spec: "/", attributes: { width: Grow }}
      - {type: base, spec: ".", attributes: { width: Grow }}
      - type: enter
        attributes: { width: Grow, style: Functional }
    attributes: *globalAttrs
    splittable: false
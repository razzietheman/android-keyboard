name: "T9Symbols"

overrideWidths:
  Regular: 0.1
  FunctionalKey: 0.15

attributes: &globalAttrs
  width: Grow
  showPopup: false
  moreKeyMode: OnlyExplicit
  useKeySpecShortcut: false
  style: Normal
  shiftable: false
  labelFlags:
    alignLabelOffCenter: false
    hasHintLabel: false

rows:
  # Rad 1 – siffror (döljs om number row är av)
  - letters: "1 2 3 4 5 6 7 8 9 0"
    numRowMode: Hideable

  # Rad 2 – extra (visas bara när number row är på)
  - letters: "• √ π ÷ × ¶ ° § ¡ ¿"
    numRowMode: Filler

  # Rad 3 – vanliga symboler (som Gboard ?123)
  - letters:
      - "@"
      - "#"
      - type: base
        spec: "kr"
        moreKeys: ["€", "£", "$", "¥", "¢"]
        attributes: { longPressEnabled: true, moreKeyMode: OnlyExplicit }
      - "%"
      - "&"
      - "-"
      - "+"
      - "("
      - ")"
      - "/"
    attributes: *globalAttrs
    splittable: false

  # Rad 4 – citat / skiljetecken
  - letters:
      - "*"
      - "\""
      - "'"
      - ":"
      - ";"
      - "!"
      - "?"
      - "~"
      - "`"
      - type: delete
        attributes:
          width: Grow
          style: Functional
          repeatableEnabled: true
    attributes: *globalAttrs
    splittable: false

  # Rad 5 – parenteser, valuta, juridik
  - letters:
      - "["
      - "]"
      - "{"
      - "}"
      - "<"
      - ">"
      - "\\"
      - "|"
      - "="
      - "^"
    attributes: *globalAttrs
    splittable: false

  # Rad 6 – copyright m.m.
  - letters:
      - "©"
      - "®"
      - "™"
      - "£"
      - "€"
      - "$"
      - "¢"
      - "_"
      - type: delete
        attributes:
          width: Grow
          style: Functional
          repeatableEnabled: true
    attributes: *globalAttrs
    splittable: false

  # Nedersta raden – endast till number (enligt din cykel)
  - bottom:
      - type: number
        attributes: { width: Grow, style: Functional }
      - {type: base, spec: ",", attributes: { width: Grow }}
      - {type: base, spec: "_", attributes: { width: Grow }}
      - type: base
        spec: "!icon/space_key| "
        attributes: { width: Grow, style: Spacebar }
      - {type: base, spec: ".", attributes: { width: Grow }}
      - type: enter
        attributes: { width: Grow, style: Functional }
    attributes: *globalAttrs
    splittable: false

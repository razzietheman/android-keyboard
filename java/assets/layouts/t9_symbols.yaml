name: "T9Symbols"

overrideWidths:
  Regular: 0.1
  FunctionalKey: 0.15

attributes: &globalAttrs
  width: Grow
  showPopup: false
  moreKeyMode: OnlyExplicit
  useKeySpecShortcut: false
  style: Normal
  shiftable: false
  labelFlags:
    alignLabelOffCenter: true
    hasHintLabel: true

rows:
  # Rad 1 – siffror (döljs om number row är aktiv)
  - letters: "1 2 3 4 5 6 7 8 9 0"
    numRowMode: Hideable

  # Rad 2 – extra symboler (visas när number row är aktiv)
  - letters: "% \\ | = [ ] < > { }"
    numRowMode: Filler

  # Rad 3 – huvudsymboler
  - letters:
      - "@"
      - ["#", "№"]
      - "$"
      - "_"
      - "%"
      - "&"
      - ["-", "_", "\u2013", "\u2014"]
      - ["+", "\u207A", "\u208A"]
      - "("
      - ")"
    attributes: *globalAttrs

  # Rad 4 – shift + vanliga symboler + delete
  - letters:
      - type: shift
        attributes: { width: Grow, style: Functional }
      - "*"
      - "\""
      - "'"
      - ":"
      - ";"
      - "!"
      - "?"
      - type: delete
        attributes: { width: Grow, style: Functional, repeatableEnabled: true }
    attributes: *globalAttrs

  # Nedersta raden
  - bottom:
      - type: alphabet
        attributes: { width: Grow, style: Functional }
      - {type: base, spec: ",", attributes: { width: Grow }}
      - type: number
        attributes: { width: Grow, style: Functional }
      - type: space
        attributes: { width: Grow }
      - {type: base, spec: "/", attributes: { width: Grow }}
      - {type: base, spec: ".", attributes: { width: Grow }}
      - type: enter
        attributes: { width: Grow, style: Functional }
    attributes: *globalAttrs
    splittable: false

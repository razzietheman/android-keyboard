name: "T9Symbols"

# T9 använder egna proportioner → Regular = 0.1
overrideWidths:
  Regular: 0.1

attributes:
  shiftable: false
  width: Grow
  showPopup: false
  moreKeyMode: OnlyExplicit
  useKeySpecShortcut: false
  style: Normal
  shiftable: false
  labelFlags:
    alignLabelOffCenter: true
    hasHintLabel: true

rows:
  # ============================
  #   Rad 1 — siffror
  # ============================
  - letters: "1 2 3 4 5 6 7 8 9 0"
    numRowMode: Hideable

  # ============================
  #   Rad 2 — symboler (filler)
  # ============================
  - letters: "% \\ | = [ ] < > { }"
    numRowMode: Filler

  # ============================
  #   Rad 3 — symboler
  # ============================
  - letters:
      - "@"
      - ["#", "№"]
      - "$"
      - "_"
      - "%"
      - "&"
      - ["-", "_", "\u2013", "\u2014", "\u207B", "\u208B", "\u00B7"]
      - ["+", "\u207A", "\u208A"]
      - "("
      - ")"

  # ============================
  #   Rad 4 — shift, delete, symboler
  # ============================
  - letters:
      - "$shift"
      - "*"
      - "\""
      - "'"
      - ":"
      - ";"
      - "!"
      - "?"
      - "$delete"

  # ============================
  #   Nedersta raden — alfabet, space, enter
  # ============================
  - bottom: "$alphabet , $number $space / . $enter"

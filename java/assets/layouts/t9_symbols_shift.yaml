name: "T9SymbolsShift"

overrideWidths:
  Regular: 0.1
  FunctionalKey: 0.15

attributes: &globalAttrs
  width: Grow
  showPopup: false
  moreKeyMode: OnlyExplicit
  useKeySpecShortcut: false
  style: Normal
  shiftable: false
  labelFlags:
    alignLabelOffCenter: false
    hasHintLabel: false

rows:
  - letters: "1 2 3 4 5 6 7 8 9 0"
    numRowMode: Hideable

  - letters:
      - "~"
      - "`"
      - "|"
      - "•"
      - "√"
      - "π"
      - "÷"
      - "×"
      - "§"
      - "°"
    attributes: *globalAttrs
    splittable: false

  - letters:
      - "£"
      - "€"
      - "$"
      - "¢"
      - "^"
      - "="
      - "{"
      - "}"
      - "\\"
      - type: delete
        attributes: { width: Grow, style: Functional, repeatableEnabled: true }
    attributes: *globalAttrs
    splittable: false

  - letters:
      - "©"
      - "®"
      - "™"
      - "["
      - "]"
      - "<"
      - ">"
      - "_"
      - type: base
        spec: "?123|!code/key_shift"
        attributes: { width: Grow, style: Functional, showPopup: false }
    attributes: *globalAttrs
    splittable: false

  - bottom:
      - type: number
        attributes: { width: Grow, style: Functional }
      - { type: base, spec: ",", attributes: { width: Grow } }
      - type: space
        attributes: { width: Grow }
      - { type: base, spec: ".", attributes: { width: Grow } }
      - type: enter
        attributes: { width: Grow, style: Functional }
    attributes: *globalAttrs
    splittable: false

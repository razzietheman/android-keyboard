name: "T9SymbolsShift"

overrideWidths:
  Regular: 0.1
  FunctionalKey: 0.15

attributes: &globalAttrs
  width: Grow
  showPopup: false
  moreKeyMode: OnlyExplicit
  useKeySpecShortcut: false
  style: Normal
  shiftable: false
  labelFlags:
    alignLabelOffCenter: false
    hasHintLabel: false

rows:
  - letters: "1 2 3 4 5 6 7 8 9 0"
    numRowMode: Hideable

  - letters:
      - "~"
      - "`"
      - "|"
      - "•"
      - "√"
      - "π"
      - "÷"
      - "×"
      - "§"
      - "°"
    attributes: *globalAttrs
    splittable: false

  - letters:
      - "£"
      - "€"
      - "$"
      - "¢"
      - "^"
      - "="
      - "{"
      - "}"
      - "\\"
      - type: delete
        attributes: { width: Grow, style: Functional, repeatableEnabled: true }
    attributes: *globalAttrs
    splittable: false

  - letters:
      - "©"
      - "®"
      - "™"
      - "["
      - "]"
      - "<"
      - ">"
      - "_"
      - type: shift
        spec: "?123"
        attributes: { width: Grow, style: Functional, labelFlags: {} }
    attributes: *globalAttrs
    splittable: false

  - bottom:
      - type: number
        attributes: { width: Grow, style: Functional }
      - {type: base, spec: ",", attributes: { width: Grow }}
      - type: base
        spec: "!icon/space_key| "
        attributes: { width: Grow, style: Spacebar }
      - {type: base, spec: ".", attributes: { width: Grow }}
      - type: enter
        attributes: { width: Grow, style: Functional }
    attributes: *globalAttrs
    splittable: false

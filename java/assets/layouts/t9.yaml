name: T9
autoShift: true
layoutSetOverrides:
  symbols: "t9_symbols"
  symbolsShifted: "t9_symbols"
  number: "t9_number"

numberRowMode: UserConfigurable
bottomRowHeightMode: Flexible
bottomRowWidthMode: Identical
rowHeightMode: FillHeight

overrideWidths:
  Regular: 0.1

attributes: &globalAttrs
  width: Grow
  showPopup: false
  moreKeyMode: OnlyExplicit
  useKeySpecShortcut: false
  style: Normal
  shiftable: false
  labelFlags:
    alignLabelOffCenter: true
    hasHintLabel: true

rows:
  # ============================
  #   Sifferrad
  # ============================
  - numbers:
      - {type: base, spec: "1", attributes: { width: Regular }}
      - {type: base, spec: "2", attributes: { width: Regular }}
      - {type: base, spec: "3", attributes: { width: Regular }}
      - {type: base, spec: "4", attributes: { width: Regular }}
      - {type: base, spec: "5", attributes: { width: Regular }}
      - {type: base, spec: "6", attributes: { width: Regular }}
      - {type: base, spec: "7", attributes: { width: Regular }}
      - {type: base, spec: "8", attributes: { width: Regular }}
      - {type: base, spec: "9", attributes: { width: Regular }}
      - {type: base, spec: "0", attributes: { width: Regular }}
    rowHeight: 0.65
    splittable: false

  # ============================
  #   T9-rad 1
  # ============================
  - letters:
      - {type: base, spec: "1"}
      - {type: base, spec: "2", hint: "ABC"}
      - {type: base, spec: "3", hint: "DEF"}
      - {type: base, spec: "!icon/delete_key|!code/key_delete",
         attributes: &functional { width: Grow, style: Functional, labelFlags: {}, repeatableEnabled: true }}
    attributes: *globalAttrs
    splittable: false

  # ============================
  #   T9-rad 2
  # ============================
  - letters:
      - {type: base, spec: "4", hint: "GHI"}
      - {type: base, spec: "5", hint: "JKL"}
      - {type: base, spec: "6", hint: "MNO"}
      - {type: base, spec: "!icon/action_emoji|!code/action_emoji",
         attributes: { width: Grow, style: Functional, labelFlags: {} }}
    attributes: *globalAttrs
    splittable: false

  # ============================
  #   T9-rad 3
  # ============================
  - letters:
      - {type: base, spec: "7", hint: "PQRS"}
      - {type: base, spec: "8", hint: "TUV"}
      - {type: base, spec: "9", hint: "WXYZ"}
      - {type: enter, attributes: { width: Grow, style: Functional, labelFlags: {} }}
    attributes: *globalAttrs
    splittable: false

  # ============================
  #   Nedersta raden
  # ============================
  - bottom:
      # Komma
      - {type: base, spec: ",", attributes: { width: Grow }}

      # Mellanslag – kort tryck = mellanslag, långtryck = 0
      - type: base
        spec: " "                    # vanlig space (CODE_SPACE)
        hint: "!icon/space_key|"
        moreKeys:
          - "!noPanelAutoMoreKey!"
          - "0"
        attributes:
          width: Grow
          style: Spacebar            # eller Functional
          longPressEnabled: true
          moreKeyMode: OnlyExplicit
          labelFlags:
            hasHintLabel: true       # krävs för att "0" ska synas

      # Punkt
      - type: base
        spec: "."
        attributes:
          width: Grow

      # ?123 (symbols-knapp) – INGEN spec här!
      - type: symbols
        attributes:
          width: Grow
          style: Functional
          labelFlags: {}

    attributes: *globalAttrs
    splittable: false

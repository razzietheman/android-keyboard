name: T9
numberRowMode: AlwaysDisabled
bottomRowHeightMode: Flexible
rowHeightMode: FillHeight

attributes: &globalAttrs
  width: Grow
  showPopup: false
  moreKeyMode: OnlyExplicit
  useKeySpecShortcut: false
  style: Normal
  shiftable: false
  labelFlags:
    alignLabelOffCenter: true
    hasHintLabel: true

rows:
  - letters:
      - {type: base, spec: "1"}
      - {type: base, spec: "2", hint: "ABC"}
      - {type: base, spec: "3", hint: "DEF"}
      - {type: base, spec: "!icon/delete_key|!code/key_delete", attributes: &functional { style: Functional, labelFlags: {}, repeatableEnabled: true }}
    splittable: false

  - letters:
      - {type: base, spec: "4", hint: "GHI"}
      - {type: base, spec: "5", hint: "JKL"}
      - {type: base, spec: "6", hint: "MNO"}
      - {type: base, spec: "!icon/action_emoji|!code/action_emoji", attributes: { style: Functional, width: FunctionalKey, labelFlags: {} }}
    splittable: false

  - letters:
      - {type: base, spec: "7", hint: "PQRS"}
      - {type: base, spec: "8", hint: "TUV"}
      - {type: base, spec: "9", hint: "WXYZ"}
      - {type: enter, attributes: *functional}
    splittable: false

  - bottom:
      - {type: base, spec: "*", attributes: { width: FunctionalKey }}

      - type: base
        spec: "!icon/space_key_for_number_layout|!code/key_space"
        hint: "0"
        moreKeys: ["!noPanelAutoMoreKey!", "0"]
        attributes:
          style: Functional
          width: Grow
          labelFlags: {}
          longPressEnabled: true

      - {type: base, spec: "#", moreKeys: "?,!,;,:,-,_,@", attributes: { width: FunctionalKey, longPressEnabled: true }}
    attributes: *globalAttrs
    splittable: false

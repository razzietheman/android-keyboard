# t9.yml — 12-tangenters T9-layout för FUTO Keyboard.
# T9-layouter med:
# - 1-9 som T9-knappar
# - action-emoji där mellanslag normalt brukar ligga
# - mellanslag flyttat ner till bottenraden
# - 0 hidden bakom long-press på mellanslag
# - * och # som vanliga väldigt små tecken
# - inga extra sifferrader ovanför T9-layoutern

name: T9
numberRowMode: AlwaysDisabled
bottomRowHeightMode: Flexible
bottomRowWidthMode: Identical
rowHeightMode: FillHeight

attributes: &globalAttrs
  width: Grow
  showPopup: false
  moreKeyMode: OnlyExplicit
  useKeySpecShortcut: false
  style: Normal
  shiftable: false
  labelFlags:
    alignLabelOffCenter: true
    hasHintLabel: true

rows:
  - letters:
      - {type: base, spec: "1"}
      - {type: base, spec: "2", hint: "ABC"}
      - {type: base, spec: "3", hint: "DEF"}
      - {type: base, spec: "!icon/delete_key|!code/key_delete", attributes: &functional { width: Grow, style: Functional, labelFlags: {}, repeatableEnabled: true }}
    attributes: *globalAttrs
    splittable: false

  - letters:
      - {type: base, spec: "4", hint: "GHI"}
      - {type: base, spec: "5", hint: "JKL"}
      - {type: base, spec: "6", hint: "MNO"}
      - {type: base, spec: "!icon/action_emoji|!code/action_emoji", attributes: { width: Grow, style: Functional, labelFlags: {} }}
    attributes: *globalAttrs
    splittable: false

  - letters:
      - {type: base, spec: "7", hint: "PQRS"}
      - {type: base, spec: "8", hint: "TUV"}
      - {type: base, spec: "9", hint: "WXYZ"}
      - {type: enter, attributes: { width: Grow, style: Functional, labelFlags: {} }}
    attributes: *globalAttrs
    splittable: false

  - bottom:
      - {type: base, spec: "*", attributes: { width: Grow }}
      - type: base
        spec: "!icon/space_key_for_number_layout| "
        hint: "0"
        moreKeys: "!noPanelAutoMoreKey!,0"
        attributes:
          style: Functional
          width: Grow
          labelFlags: {}
          longPressEnabled: true
      - {type: base, spec: "#", moreKeys: "?,!,;,:,-,_,@", attributes: { width: Grow, longPressEnabled: true }}
    attributes: *globalAttrs
    splittable: false
